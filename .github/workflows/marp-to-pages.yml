name: marp-to-pages
concurrency: marp-to-pages

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Ensure build dir exists
        run: mkdir -p build

      - name: Copy images directory (if exists)
        run: if [[ -d images ]]; then cp -R images build/images; fi

      - name: Marp Build (Introducing)
        uses: ./.github/actions/marp-build
        with:
          input: introducing-pharo-agentic-browser-en.md
          output-basename: introducing-pharo-agentic-browser-en

      - name: Marp Build (Introducing, ja)
        uses: ./.github/actions/marp-build
        with:
          input: introducing-pharo-agentic-browser-ja.md
          output-basename: introducing-pharo-agentic-browser-ja

      - name: Marp Build (Web UI)
        uses: ./.github/actions/marp-build
        with:
          input: pharo-agentic-browser-web-ui-en.md
          output-basename: pharo-agentic-browser-web-ui-en

      - name: Marp Build (Scripting)
        uses: ./.github/actions/marp-build
        with:
          input: pharo-agentic-browser-scripting-en.md
          output-basename: pharo-agentic-browser-scripting-en

      - name: Copy HTML as index and add .nojekyll
        run: cp build/introducing-pharo-agentic-browser-en.html build/index.html && touch build/.nojekyll

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy production
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./build/
          clean-exclude: pr-preview/
